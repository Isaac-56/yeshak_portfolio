name: One-time EmailJS delivery diagnostic
on:
  push:
    branches: ["redesign/portfolio-v3-review"]
    paths: [".github/workflows/emailjs-diagnostic-once.yml"]
permissions:
  contents: read
jobs:
  test-existing-service:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Send a single test message via configured EmailJS template
        run: node scripts/emailjs-probe.mjs
